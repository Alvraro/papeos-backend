<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>Papeos · Plan semanal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="plan">
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Papeos, página de inicio">
        <span class="brand-mark">p.</span><span>Papeos</span>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a class="nav-link active" href="index.html">Plan</a>
        <a class="nav-link" href="platos.html">Platos</a>
        <a class="nav-link" href="alimentos.html">Alimentos</a>
      </nav>
    </header>
    <main>
      <section class="page-heading plan-heading">
        <div>
          <p class="eyebrow">Organiza tus comidas</p>
          <h1>Plan semanal</h1>
          <p id="week-range" class="subheading" aria-live="polite"></p>
        </div>
        <div class="week-controls" aria-label="Cambiar semana">
          <button id="previous-week" class="icon-button" type="button" aria-label="Semana anterior" title="Semana anterior">←</button>
          <button id="next-week" class="icon-button" type="button" aria-label="Semana siguiente" title="Semana siguiente">→</button>
        </div>
      </section>
      <div id="plan-status" class="status-message" role="status"></div>
      <section id="weekly-plan" class="weekly-plan" aria-label="Plan de comidas de la semana"></section>
    </main>
  </div>
</body>
</html>
